name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install -g pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the extension version
        run: |
          version="$(node -p "require('./integrations/vscode/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in integrations/vscode/package.json"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" integrations/vscode/maestri-bridge.vsix --title "Maestri Bridge $GITHUB_REF_NAME" --generate-notes
